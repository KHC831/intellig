name: Publish

# Publishes IntelliG to the VS Code Marketplace and Open VSX when a
# semver tag is pushed (e.g. `v0.1.2`, `v0.2.0`, `v1.0.0`).
#
# Trigger:
#   git tag v0.1.2
#   git push origin v0.1.2
#
# The tag's version (without the leading `v`) MUST match the version
# in `package.json` on the tagged commit; the workflow refuses to
# proceed if they disagree, so you can never accidentally publish a
# different version than the one labelled by the tag.
#
# Required GitHub Secrets:
#   VSCE_PAT         — Azure DevOps PAT for `KaHoChan` publisher
#                      (Marketplace → Manage scope, "All accessible
#                      organizations").
#   OPEN_VSX_TOKEN   — Open VSX access token for the `KaHoChan`
#                      namespace (https://open-vsx.org/user-settings/tokens).
#
# Set these at: Settings → Secrets and variables → Actions → New
# repository secret. Without them, the publish steps fail loudly.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Refuse to publish anything until the same gates that gate a
      # main-branch CI run also pass on the tagged commit.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Property tests
        run: npm run test:property

      - name: Tag-version coherence
        # The git tag's numeric portion must equal package.json.version
        # on the tagged commit. Without this, `git tag v0.2.0` on a
        # commit where package.json still says 0.1.5 would publish 0.1.5
        # under a misleading tag.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "✗ tag version (v$tag_version) does not match package.json version ($pkg_version)" >&2
            echo "  Bump package.json on main, commit, push, then re-tag." >&2
            exit 1
          fi
          echo "✓ tag v$tag_version matches package.json $pkg_version"

      - name: Build .vsix
        run: |
          version="$(node -p 'require("./package.json").version')"
          npx --yes @vscode/vsce@2.24.0 package --out "intellig-$version.vsix"

      - name: Refuse dogfood-suffixed artifact
        run: |
          version="$(node -p 'require("./package.json").version')"
          npm run check:publish-vsix -- "intellig-$version.vsix"

      - name: Manifest spot-check
        run: |
          version="$(node -p 'require("./package.json").version')"
          unzip -p "intellig-$version.vsix" extension.vsixmanifest \
            | grep -E "Identity|Description|GalleryFlags|Source|Support" \
            || true

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "✗ VSCE_PAT secret is not set" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          npx --yes @vscode/vsce@2.24.0 publish \
            --packagePath "intellig-$version.vsix" \
            --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "✗ OPEN_VSX_TOKEN secret is not set" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          npx --yes ovsx@latest publish "intellig-$version.vsix" \
            -p "$OPEN_VSX_TOKEN"

      - name: Upload .vsix as workflow artifact
        # Keep the published .vsix attached to the workflow run for
        # auditing; useful when comparing what shipped against the
        # tagged source.
        uses: actions/upload-artifact@v4
        with:
          name: intellig-vsix
          path: intellig-*.vsix
          retention-days: 90
