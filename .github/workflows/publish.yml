name: Publish

# Publishes IntelliG to the VS Code Marketplace and Open VSX. Two
# triggers:
#
# 1. Manual dispatch — recommended when CLI tag-push isn't available.
#    Go to repo → Actions → Publish → "Run workflow", then either
#    enter a version explicitly or leave the input blank to use the
#    version currently in package.json on `main`. The workflow creates
#    and pushes the matching `v<version>` tag itself before publishing.
#
# 2. Tag push — for users with CLI access:
#       git tag v0.1.2
#       git push origin v0.1.2
#    The workflow runs against the tagged commit and publishes.
#
# In both paths, the tag's version (without the leading `v`) MUST
# equal `package.json.version` on the tagged commit. Mismatches abort
# the workflow before any publish step runs.
#
# GitHub Secrets:
#   OPEN_VSX_TOKEN   — REQUIRED. Open VSX access token for the
#                      `KaHoChan` namespace
#                      (https://open-vsx.org/user-settings/tokens).
#                      The Open VSX publish step fails loudly if missing.
#   VSCE_PAT         — OPTIONAL. Azure DevOps PAT for the `KaHoChan`
#                      Marketplace publisher (Marketplace → Manage
#                      scope, "All accessible organizations"). When
#                      missing, the Marketplace publish step is
#                      skipped with a clear log line; Open VSX still
#                      proceeds. Add this secret later to enable
#                      automated Marketplace publishing without
#                      editing this workflow.
#
# Set these at: Settings → Secrets and variables → Actions → New
# repository secret.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.2). Leave blank to use the version from package.json on main.'
        required: false
        type: string

# `contents: write` is required so the workflow can push the tag it
# creates on a manual dispatch. Tag-push triggers don't need it (the
# tag already exists) but the same job handles both, so the union of
# permissions applies.
permissions:
  contents: write

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    # 30 min: same gates as CI (lint, compile, unit, property — ~5 min)
    # plus the build + Marketplace + Open VSX upload (~3-5 min, network-
    # dependent). 30 leaves enough headroom for either gallery to be
    # slow without killing a real publish.
    timeout-minutes: 30

    steps:
      - name: Checkout
        # v5+ runs on Node 24 (clears the mid-2026 deprecation).
        uses: actions/checkout@v5
        with:
          # Required so the workflow can push the tag it creates on
          # a manual dispatch (the default checkout uses a token that
          # cannot push).
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch tags so the duplicate-tag check below can see them.
          fetch-depth: 0

      - name: Setup Node
        # `cache: 'npm'` deliberately omitted. The setup-node cache
        # post-step runs `tar` over ~/.npm at job teardown and is
        # prone to cancellation when the runner is under pool pressure,
        # which marks the entire run as failed even when every publish
        # step has already succeeded. The honest signal is worth the
        # ~30s lost on each `npm ci` cold install.
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Refuse to publish anything until the same gates that gate a
      # main-branch CI run also pass on the commit being released.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Property tests
        run: npm run test:property

      - name: Resolve release version
        id: resolve_version
        # Two trigger paths:
        #   - Tag push:          $GITHUB_REF_NAME is `v0.1.2`. Strip the
        #                        leading `v` and require it to equal
        #                        package.json.version on the tagged
        #                        commit.
        #   - Manual dispatch:   ${{ inputs.version }} may be empty
        #                        (use package.json) or explicit
        #                        (must equal package.json). The
        #                        workflow creates the tag itself in
        #                        the next step.
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          echo "package.json version: $pkg_version"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "✗ tag version (v$tag_version) does not match package.json version ($pkg_version)" >&2
              echo "  Bump package.json on main, commit, push, then re-tag." >&2
              exit 1
            fi
            echo "✓ tag v$tag_version matches package.json $pkg_version"
            release_version="$pkg_version"
            tag_pre_existed=true
          else
            input_version="${{ inputs.version }}"
            if [ -n "$input_version" ] && [ "$input_version" != "$pkg_version" ]; then
              echo "✗ workflow input version ($input_version) does not match package.json version ($pkg_version)" >&2
              echo "  Bump package.json on main first, then re-run with a matching input (or leave blank)." >&2
              exit 1
            fi
            release_version="$pkg_version"
            tag_pre_existed=false
            echo "✓ manual dispatch will publish $release_version"
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag_pre_existed=$tag_pre_existed" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag (manual dispatch only)
        # On manual dispatch we create the tag ourselves. If the tag
        # already exists (e.g. a prior dispatch published this version),
        # fail loudly rather than silently re-using or overwriting it.
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="v${{ steps.resolve_version.outputs.release_version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "✗ tag $tag already exists. Bump package.json to a new version before re-running." >&2
            exit 1
          fi
          echo "✓ tag $tag is available"

      - name: Create and push tag (manual dispatch only)
        # When the workflow is triggered via `workflow_dispatch` the
        # repo doesn't have the release tag yet. Create it pointing at
        # whatever commit GitHub checked out (typically the tip of
        # main, since the workflow is selected from the main branch
        # in the UI), then push it so it's discoverable in the GUI.
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="v${{ steps.resolve_version.outputs.release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "✓ pushed $tag → origin"

      - name: Build .vsix
        run: |
          version="$(node -p 'require("./package.json").version')"
          npx --yes @vscode/vsce@2.24.0 package --out "intellig-$version.vsix"

      - name: Refuse dogfood-suffixed artifact
        run: |
          version="$(node -p 'require("./package.json").version')"
          npm run check:publish-vsix -- "intellig-$version.vsix"

      - name: Manifest spot-check
        run: |
          version="$(node -p 'require("./package.json").version')"
          unzip -p "intellig-$version.vsix" extension.vsixmanifest \
            | grep -E "Identity|Description|GalleryFlags|Source|Support" \
            || true

      - name: Publish to VS Code Marketplace
        # Optional. When VSCE_PAT is unset (e.g. tokenless / manual-
        # upload-only workflow), this step skips with a clear log line
        # rather than failing the run. Adding the secret later enables
        # automated Marketplace publishing on the next release without
        # touching this workflow.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "ℹ VSCE_PAT secret is not set — skipping VS Code Marketplace publish."
            echo "  To enable: Settings → Secrets and variables → Actions → New repository secret."
            echo "  Until then, upload intellig-<version>.vsix manually at"
            echo "  https://marketplace.visualstudio.com/manage/publishers/KaHoChan"
            exit 0
          fi
          version="$(node -p 'require("./package.json").version')"
          npx --yes @vscode/vsce@2.24.0 publish \
            --packagePath "intellig-$version.vsix" \
            --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "✗ OPEN_VSX_TOKEN secret is not set" >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          npx --yes ovsx@latest publish "intellig-$version.vsix" \
            -p "$OPEN_VSX_TOKEN"

      - name: Upload .vsix as workflow artifact
        # Keep the published .vsix attached to the workflow run for
        # auditing; useful when comparing what shipped against the
        # tagged source.
        # v6+ defaults to Node 24 (clears the mid-2026 deprecation).
        # v5 had preliminary Node 24 support but still ran on Node 20
        # by default; only v6+ flips the default.
        uses: actions/upload-artifact@v6
        with:
          name: intellig-vsix
          path: intellig-*.vsix
          retention-days: 90
