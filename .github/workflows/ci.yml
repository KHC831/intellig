name: CI

# Pull requests only: a merge into main would re-run what the PR already
# passed. Drafts are skipped until marked ready for review.
on:
  pull_request:
    branches: [main, master, feat/**]
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    # 25 min: the e2e + ext-host lanes routinely run 12-14 min on a
    # contended runner; 15 min cliff was timing out runs whose actual
    # work succeeded. Headroom > tight gate when the timeout is killing
    # cleanup mid-tar (see commit 8b81680).
    timeout-minutes: 25

    steps:
      - name: Checkout
        # v5+ runs on Node 24. The previous v4 emitted a Node-20
        # deprecation warning that becomes an enforcement-failure
        # mid-2026.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        # `cache: 'npm'` deliberately omitted. The setup-node cache
        # post-step runs `tar` over ~/.npm at job teardown and is
        # prone to cancellation when the runner is under pool pressure,
        # which marks the entire run as failed even when every CI step
        # has already succeeded. The honest signal is worth the ~30s
        # lost on each `npm ci` cold install.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Strict lint gate (Phase 4). Any lint error fails the pipeline;
      # `--max-warnings 0` additionally fails on new warnings so drift is
      # caught at PR time rather than accumulating. Keep the local
      # `npm run lint` alias free of flags so `npm run lint --fix` and
      # editor integrations keep working unchanged.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # Built once here; the Electron lanes below run against this build.
      - name: Compile
        run: npm run compile

      - name: Compile tests
        run: npm run compile:tests

      # TL-100. Single umbrella step replacing 8 individual structural-
      # guard invocations. Adding a new guard now means appending one
      # entry to `check:all` in package.json — no ci.yml edit required.
      # Runs post-compile because check:vsix-clean reads `out/extension.js`
      # via vsce ls (vsce resolves package.json `main` against the disk).
      # Note: TL-95 dogfood-shape rejection is exercised separately
      # below (the umbrella runs `check:publish-vsix` with no args, which
      # is the pass shape; the fail shape is dual-asserted explicitly).
      - name: Structural guards (umbrella)
        run: npm run check:all

      # TL-93 prerelease-state.json shape. Not in `check:all` because
      # it's a node-eval contract check rather than a script invocation.
      # The prepublish-guard chains off `vscode:prepublish`, which only
      # fires on `vsce package`; CI doesn't run packaging, so JSON-shape
      # regressions wouldn't surface until a maintainer ran `vsce package`
      # locally. This step catches them at PR time, independently of the
      # live tree's placeholder state (which legitimately fails pre-1.0).
      - name: Structural guard — prerelease-state.json shape (TL-93)
        run: |
          node -e "
            const s = require('./scripts/prerelease-state.json');
            const supported = ['minMarkers', 'sha256', 'regex', 'literal'];
            for (const [k, v] of Object.entries(s)) {
              if (k.startsWith('\$') || k.startsWith('_')) continue;
              if (!v || typeof v !== 'object') {
                throw new Error('entry ' + k + ' is malformed (not an object)');
              }
              if (typeof v.path !== 'string' || v.path.length === 0) {
                throw new Error('entry ' + k + ' missing required string \`path\`');
              }
              if (typeof v.rule !== 'string' || !supported.includes(v.rule)) {
                throw new Error('entry ' + k + ' has unknown rule ' + JSON.stringify(v.rule) + '; supported: ' + supported.join(', '));
              }
            }
            console.log('[check:prerelease-state-shape] OK — ' + Object.keys(s).filter(k => !k.startsWith('\$') && !k.startsWith('_')).length + ' fingerprint entries valid.');
          "

      # TL-95 dogfood-shape rejection (dual-shape coverage). The umbrella
      # exercises check:publish-vsix's pass shape (no args). Here we
      # additionally confirm the guard correctly REJECTS a dogfood-tagged
      # filename — a regression that accidentally accepts `*-dogfood.vsix`
      # would surface here.
      - name: Structural guard — publish vsix dogfood-shape rejection (TL-95)
        run: |
          if npm run check:publish-vsix -- intellig-0.1.0-dogfood.vsix; then
            echo "[ci] FAIL: check:publish-vsix did not reject *-dogfood.vsix" >&2
            exit 1
          fi

      - name: Unit tests
        run: npm run test:unit

      # R6 Gap-D: 10× property-test stress guard. R4's 5× budget caught TR-5
      # but missed TR-6 / TR-7, which were latent through R1-R3. A 10× budget
      # keeps the same class of flake from slipping again.
      #
      # Wall-time: ~17s × 10 ≈ ~3 min. Acceptable per-PR cost; if this becomes
      # the bottleneck, move to a nightly schedule via workflow_dispatch /
      # schedule trigger, not by lowering the run count.
      - name: Property tests (10× stress — R6 Gap-D)
        run: npm run test:property:stress

      # R6 Gap-A: extension-host smoke suite. Boots a real VS Code host,
      # activates the extension, and asserts every package.json-declared
      # command is registered. Catches duplicate-register + webview-CSP
      # regressions that unit-test mocks silently paper over.
      - name: Extension-host smoke tests
        run: xvfb-run -a npm run test:ext-host:run

      # Tier-2 command E2E suite. Runs each shipped command against a real
      # temp-dir git repo and verifies the effect by re-reading git state.
      # Catches command-level regressions that depend on real git subprocess
      # output (not the in-process mocks the unit suite uses).
      - name: Tier-2 command E2E tests
        run: xvfb-run -a npm run test:e2e:run

      # Computed-style lane. Renders production css + production markup in a
      # real engine and asserts resolved values, which is the only lane with a
      # cascade and a layout engine — jsdom has neither, so a rule that never
      # matches, loses on specificity, or is overpainted is invisible to every
      # other lane. Chromium is pinned to the playwright-core version rather
      # than taken from the runner image so a base-image bump cannot change
      # what the assertions measure.
      - name: Install pinned Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Visual (computed-style) tests
        run: npm run test:visual
        env:
          INTELLIG_VISUAL_CHANNEL: chromium

  # Cross-OS path coverage. The ubuntu `test` job is the full gate; this job
  # runs the path-sensitive lanes (unit + property) on macOS and Windows so
  # platform path bugs are caught — separator handling, drive letters, and the
  # macOS /var → /private/var symlink that bit blame repo resolution. Linux-only
  # CI never sees those. Lint and the bash structural guards stay on ubuntu.
  cross-os:
    name: Cross-OS unit/property (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:property

  # macOS end-to-end. Runs the real-host e2e suite on macOS (headed, no xvfb)
  # so command-level regressions tied to macOS path/symlink behaviour are caught
  # in the same real-git harness the ubuntu job uses. Windows e2e is omitted for
  # now (real-host launch + git fixtures are flakier there); cross-os above
  # still exercises Windows path logic through unit/property.
  e2e-macos:
    name: Tier-2 E2E (macOS)
    runs-on: macos-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run compile
      - run: npm run compile:tests
      - run: npm run test:ext-host:run
      - run: npm run test:e2e:run

  # Patch coverage: new/changed source lines in a PR must be tested. Diffs
  # against the PR base, generates unit-lane coverage, then fails if changed
  # executable lines fall below the threshold. Complements
  # the global suite — the global % barely moves when a small untested branch
  # lands, but this gate catches it on the lines that changed. fetch-depth: 0 so
  # the base ref is present to diff against. e2e/ext-host-only paths are excluded
  # via scripts/patch-coverage-ignore.json (the unit lane can't see them).
  patch-coverage:
    name: Patch coverage (changed lines)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run coverage
      - name: Enforce patch coverage on changed lines
        env:
          PATCH_COVERAGE_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: npm run check:patch-coverage
