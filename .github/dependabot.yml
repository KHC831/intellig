version: 2
updates:
  # Dev tooling only: the extension has no runtime dependencies (everything
  # ships bundled). Grouped so a week's updates arrive as one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A major upgrade of the tooling needs its own review (config formats,
      # dropped Node versions, changed defaults), so it is made by hand. This
      # also holds back a security fix that needs a major; Dependabot alerts
      # still report it.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Must equal the minimum VS Code in engines.vscode; vsce refuses a
      # newer one. Raise both together, by hand.
      - dependency-name: '@types/vscode'
      # Bundled into the package, and named with its version in
      # THIRD_PARTY_NOTICES.md. Pre-1.0 minors can break, so anything past a
      # patch is a deliberate upgrade.
      - dependency-name: monaco-editor
        update-types: ['version-update:semver-minor']
      - dependency-name: neverthrow
        update-types: ['version-update:semver-minor']
      - dependency-name: '@vscode/codicons'
        update-types: ['version-update:semver-minor']
      # A minor release can reformat code, failing lint until the PR runs
      # `npm run fix`, which Dependabot cannot do.
      - dependency-name: prettier
        update-types: ['version-update:semver-minor']
      # Builds the bundles; pre-1.0, so a minor can change the output.
      - dependency-name: esbuild
        update-types: ['version-update:semver-minor']
    groups:
      # The parser and the plugin only work at the same version.
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
